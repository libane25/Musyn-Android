name: Build Musyn Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout original Musyn
        uses: actions/checkout@v4
        with:
          repository: Voryn-Labs/Musyn
          path: musyn-source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check project
        working-directory: musyn-source
        run: test -f pubspec.yaml

      - name: Generate Android files
        working-directory: musyn-source
        run: flutter create --platforms=android --org com.libane25 .

      - name: Install dependencies
        working-directory: musyn-source
        run: flutter pub get

      - name: Build APK
        working-directory: musyn-source
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Musyn-Android-ARM64
          path: musyn-source/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
